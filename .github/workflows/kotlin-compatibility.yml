name: Kotlin 2.4.20 + Core 4.11.1 compatibility

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kotlin-api-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout lets-plot-kotlin
        uses: actions/checkout@v4
        with:
          path: kotlin-api

      - name: Checkout upgraded lets-plot core
        uses: actions/checkout@v4
        with:
          repository: changhexuefei/lets-plot
          ref: master
          path: core

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v4

      - name: Configure source-level Core integration
        run: |
          echo "LETS_PLOT_CORE_BUILD=${GITHUB_WORKSPACE}/core" >> "$GITHUB_ENV"
          cat > core/local.properties <<EOF
          enable_python_package=false
          architecture=x86_64
          EOF
          cat > kotlin-api/local.properties <<EOF
          sonatype.username=
          sonatype.password=
          EOF

      - name: Compile Kotlin API targets
        working-directory: kotlin-api
        run: |
          ./gradlew \
            :plot-api:compileKotlinJvm \
            :plot-api:compileKotlinJs \
            :plot-api:compileKotlinWasmJs \
            --stacktrace

      - name: Run Kotlin API JVM tests
        working-directory: kotlin-api
        run: ./gradlew :plot-api:jvmTest --stacktrace

      - name: Run JSON tests
        working-directory: kotlin-api
        run: ./gradlew :json:test --stacktrace

      - name: Run Jupyter tests
        working-directory: kotlin-api
        run: ./gradlew :jupyter:test --stacktrace

      - name: Verify Kotlin API local publication
        working-directory: kotlin-api
        run: ./gradlew :plot-api:publishAllPublicationsToMavenLocalRepository --stacktrace
